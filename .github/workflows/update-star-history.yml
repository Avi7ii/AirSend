name: Update Star History

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-star-history
  cancel-in-progress: false

jobs:
  update:
    name: Refresh chart
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch stargazer history and render SVG
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api --paginate --slurp \
            -H "Accept: application/vnd.github.star+json" \
            "repos/${GH_REPO}/stargazers?per_page=100" \
            > "${RUNNER_TEMP}/stargazers.json"
          node scripts/update-star-history.mjs \
            "${RUNNER_TEMP}/stargazers.json" \
            docs/assets/airsend-star-history.svg

      - name: Commit updated chart
        run: |
          git config user.name "Thom Yorke"
          git config user.email "89524335+Avi7ii@users.noreply.github.com"
          git var GIT_AUTHOR_IDENT

          if git diff --quiet -- docs/assets/airsend-star-history.svg; then
            echo "Star history is already current."
            exit 0
          fi

          git add docs/assets/airsend-star-history.svg
          git commit -m "docs: update star history [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
