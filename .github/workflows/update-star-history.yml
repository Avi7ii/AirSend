name: Update Star History

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-star-history
  cancel-in-progress: false

jobs:
  update:
    name: Refresh chart
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch stargazer history and render SVG
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          owner="${GH_REPO%%/*}"
          name="${GH_REPO#*/}"
          gh api graphql --paginate --slurp \
            -f owner="${owner}" \
            -f name="${name}" \
            -f query='query($owner: String!, $name: String!, $endCursor: String) { repository(owner: $owner, name: $name) { stargazers(first: 100, after: $endCursor, orderBy: {field: STARRED_AT, direction: ASC}) { edges { starredAt } pageInfo { hasNextPage endCursor } } } }' \
            > "${RUNNER_TEMP}/stargazer-pages.json"
          jq '[.[].data.repository.stargazers.edges[] | {starred_at: .starredAt}]' \
            "${RUNNER_TEMP}/stargazer-pages.json" \
            > "${RUNNER_TEMP}/stargazers.json"
          node scripts/update-star-history.mjs \
            "${RUNNER_TEMP}/stargazers.json" \
            docs/assets/airsend-star-history.svg

      - name: Commit updated chart
        run: |
          git config user.name "Thom Yorke"
          git config user.email "89524335+Avi7ii@users.noreply.github.com"
          git var GIT_AUTHOR_IDENT

          if git diff --quiet -- docs/assets/airsend-star-history.svg; then
            echo "Star history is already current."
            exit 0
          fi

          git add docs/assets/airsend-star-history.svg
          git commit -m "docs: update star history [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
